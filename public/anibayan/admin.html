<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AniBayan administrator workspace: accounts, user reports, organization applications and site health."><title>AniBayan — Admin workspace</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="dashboard.css"><script>
