<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always unset X-Powered-By
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Permitted-Cross-Domain-Policies "none"
        Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=()"
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://*.tawk.to; script-src 'self' https://*.tawk.to https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://*.tawk.to https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: blob: https://kteeanqfarwwptpvvqxh.supabase.co https://*.tawk.to https://cdn.jsdelivr.net https://tawk.link https://*.tawk.link https://s3.amazonaws.com https://tile.openstreetmap.org https://unpkg.com; font-src 'self' data: https://*.tawk.to https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://api.paymongo.com https://*.tawk.to wss://*.tawk.to https://*.tawk.help https://*.tawk.link https://s3.amazonaws.com; frame-src 'self' https://*.tawk.to https://*.tawk.help; media-src 'self' blob: https://*.tawk.to https://s3.amazonaws.com; worker-src 'self' blob:; upgrade-insecure-requests"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
